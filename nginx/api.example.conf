# Mini App API — api.ttstars.xyz
#
# Reverse-proxies the `api` subdomain to the SAME FastAPI backend that already
# serves the bot webhook / payment webhooks / Lolz feed. There is no path
# rewrite: a request to https://api.ttstars.xyz/v1/... reaches the app as
# /v1/... unchanged.
#
# CORS is handled inside the application (FastAPI CORSMiddleware, configured via
# TELEGRAM_MINIAPP_CORS_ORIGINS) — do NOT add Access-Control-* headers here or
# they will be duplicated.
#
# Prerequisites:
#   1) DNS: add an A record  api.ttstars.xyz -> <EC2 public/Elastic IP>.
#   2) TLS: issue a certificate, e.g.
#        sudo certbot --nginx -d api.ttstars.xyz
#      (certbot will fill in the ssl_certificate paths used below).
#   3) Make sure proxy_pass points at the same port as SERVER_PORT in .env.

server {
    listen 80;
    server_name api.ttstars.xyz;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.ttstars.xyz;

    ssl_certificate     /etc/letsencrypt/live/api.ttstars.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ttstars.xyz/privkey.pem;

    # initData / login payloads are small; cap request bodies defensively.
    client_max_body_size 256k;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }
}
